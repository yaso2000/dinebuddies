<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>
    // Boot watchdog: if the app hasn't mounted after a grace period, show a FRIENDLY
    // themed "taking longer than usual · Reload" screen to users. The raw technical
    // diagnostic (green terminal + JS error/stack) is shown ONLY on localhost so we
    // can still debug dev/native-shell issues without alarming real users.
    (function () {
      window.__bootErrors = [];
      var isDev = /^(localhost|127\.0\.0\.1|\[::1\]|.*\.local)$/i.test(location.hostname);
      var shown = false;
      function record(msg) { window.__bootErrors.push(msg); if (shown) render(); }
      window.addEventListener('error', function (e) {
        var msg = (e.error && e.error.message) || e.message || String(e);
        var stack = (e.error && e.error.stack) || '';
        record('MESSAGE: ' + msg + (stack ? '\n\nSTACK:\n' + stack : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        var msg = (r && r.message) || String(r);
        var stack = (r && r.stack) || '';
        record('UnhandledRejection MESSAGE: ' + msg + (stack ? '\n\nSTACK:\n' + stack : ''));
      });
      function render() {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        if (isDev) {
          var pre = document.getElementById('__boot_diag');
          if (!pre) {
            pre = document.createElement('pre');
            pre.id = '__boot_diag';
            pre.style.cssText = 'position:fixed;inset:0;background:#000;color:#0f0;font:11px/1.4 monospace;padding:14px;overflow:auto;z-index:999999;white-space:pre-wrap;margin:0;';
            document.body.appendChild(pre);
          }
          pre.textContent = 'BOOT DIAGNOSTICS (dev only)\nlocation.href: ' + location.href +
            '\n\n' + window.__bootErrors.join('\n\n---\n\n');
          return;
        }
        if (document.getElementById('__boot_friendly')) return;
        var dark = document.documentElement.getAttribute('data-theme') !== 'light';
        var wrap = document.createElement('div');
        wrap.id = '__boot_friendly';
        wrap.dir = 'rtl';
        wrap.style.cssText = 'position:fixed;inset:0;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:' + (dark ? '#0f1115' : '#f7f8fa') + ';color:' + (dark ? '#e6e8ec' : '#1a1a1a') + ';';
        wrap.innerHTML =
          '<style>@keyframes __bootspin{to{transform:rotate(360deg)}}</style>' +
          '<div style="width:40px;height:40px;border:3px solid rgba(128,128,128,.25);border-top-color:#f97316;border-radius:50%;animation:__bootspin .9s linear infinite;"></div>' +
          '<div style="font-size:15px;font-weight:700;">التحميل يستغرق وقتًا أطول من المعتاد</div>' +
          '<div style="font-size:12px;opacity:.6;">Taking a little longer than usual</div>' +
          '<button onclick="location.reload()" style="margin-top:6px;padding:11px 24px;border:none;border-radius:12px;background:#f97316;color:#fff;font-weight:700;font-size:14px;cursor:pointer;">إعادة التحميل · Reload</button>';
        document.body.appendChild(wrap);
      }
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) { shown = true; render(); }
      }, 10000);
    })();
  </script>
  <script>
    (function () {
      try {
        var key = 'theme';
        var t = localStorage.getItem(key);
        if (t !== 'light' && t !== 'dark') t = 'dark';
        var html = document.documentElement;
        html.setAttribute('data-theme', t);
        var biz = false;
        try { biz = !!sessionStorage.getItem('dineb_biz_uid'); } catch (e) {}
        var path = location.pathname || '';
        if (!biz && (path === '/login' || path.indexOf('/business/login') === 0)) {
          biz = new URLSearchParams(location.search || '').get('tab') === 'business';
        }
        if (!biz && /^\/(business-dashboard|business\/onboarding|business\/pricing|signup\/business|business\/signup|business-signup)(\/|$)/.test(path)) {
          biz = true;
        }
        html.setAttribute('data-account-theme', biz ? 'business' : 'personal');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style id="boot-critical-theme">
    html[data-theme="light"] body { background: #f8fafc; color: #0f172a; }
    html[data-theme="dark"] body { background: #0b0812; color: #f8fafc; }
    @media (min-width: 1024px) {
      html, body, #root { width: 100%; min-height: 100%; }
    }
  </style>

<body style="margin: 0; padding: 0; overscroll-behavior-y: none;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Capture beforeinstallprompt EARLY — before React loads
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
    });
    // Service worker registration is in src/main.jsx (prod only). Registering sw.js on
    // localhost breaks Vite HMR and can leave blank screens until a full reload.
  </script>
</body>
